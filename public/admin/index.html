<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon-192.png"><title>Admin | BOYS.SEE_ & GIRLS.SEE_</title><link rel="stylesheet" href="../css/style.css">
<style>.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:.85rem;margin:8px 0 2px}.f input,.f select,.f textarea{width:100%}textarea{min-height:70px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.item{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}.bad{color:#b00020}.ok{color:#0a7a2f}
.btn.sec{background:#fff;color:var(--fg)}.btn.danger{background:#b00020;border-color:#b00020}.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}.btn.ic{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}.btn.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.swr{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;border:0;background:none;color:inherit;font:inherit;cursor:pointer}.swr .sw{position:relative;width:46px;height:26px;border-radius:13px;background:#b9b9b9;transition:background .15s;flex:none}.swr .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}.swr[aria-checked="true"] .sw{background:#1a7f37}.swr[aria-checked="true"] .sw::after{left:23px}.swr:disabled{opacity:.6}.swr .swt{min-width:56px;text-align:left}.dlg{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;margin:auto;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.35)}.dlg::backdrop{background:rgba(0,0,0,.55)}.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}body:has(dialog[open]){overflow:hidden}[hidden]{display:none!important}</style></head>
<body class="boys"><header><h1>Dashboard Admin</h1><p id="top" class="msg" role="status"></p></header>
<main>
<section id="login" class="box f" hidden><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password"><p></p><button id="go" class="btn" type="button">Masuk</button></section>
<section id="app" hidden>
<div class="row"><span id="sum" class="note"></span><button id="out" class="btn sec" type="button">Keluar</button><button id="new" class="btn" type="button">Tambah produk</button></div>
<div class="tools"><input id="q" type="search" placeholder="Cari nama/nomor" aria-label="Cari"><select id="fb" aria-label="Brand"><option value="">Semua brand</option><option value="boys">BOYS.SEE_</option><option value="girls">GIRLS.SEE_</option></select><select id="fs" aria-label="Status"><option value="">Semua status</option><option value="published">Terbit</option><option value="draft">Nonaktif</option></select></div>
<div id="list"></div>
<dialog id="form" class="dlg f" aria-labelledby="ft"><div class="dh"><h2 id="ft" tabindex="-1" autofocus style="margin:0;outline:0">Produk</h2><button id="x" class="btn sec ic" type="button" title="Tutup" aria-label="Tutup"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
<label for="brand">Brand</label><select id="brand"><option value="boys">BOYS.SEE_</option><option value="girls">GIRLS.SEE_</option></select>
<label for="code">Nomor produk (otomatis jika kosong)</label><input id="code" type="number" min="1" step="1" inputmode="numeric" placeholder="579">
<label for="name">Nama</label><input id="name" maxlength="200">
<label for="aff">URL affiliate Shopee (https://...)</label><input id="aff" type="url">
<label for="file">Foto produk (JPG/PNG/WebP, otomatis dikecilkan)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp">
<div id="pvw" class="row" hidden><img id="prev" alt="Pratinjau foto" width="120" height="120" style="object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee"><button id="rmph" class="btn sec" type="button">Hapus foto</button></div>
<label for="img">atau URL gambar (https://...)</label><input id="img" type="url">
<p id="fm" class="msg" role="status"></p><div class="row"><button id="save" class="btn" type="button">Simpan</button><button id="cancel" class="btn sec" type="button">Batal</button><a id="test" class="btn sec" target="_blank" rel="noopener noreferrer" hidden>Uji tautan</a></div></dialog>
</section></main>
<script src="../js/config.js"></script><script src="../js/admin.js"></script><script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script></body></html>
